<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warframe Prime Tracker · Controla tus Warframes y armas Prime</title>
    <meta name="description" content="Tracker gratuito de Warframe Prime: marca los componentes que tienes de cada Warframe, arma, centinela y archwing Prime, filtra por estado y mira tu progreso. Se guarda en el navegador.">
    <meta name="author" content="David Hernáez Castejón">
    <meta name="theme-color" content="#0a0a0f">
    <link rel="canonical" href="https://warframe-checker.danapps.dev/">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- Lo que se ve al compartir el enlace -->
    <meta property="og:title" content="Warframe Prime Tracker">
    <meta property="og:description" content="Marca los componentes Prime que tienes y mira cuánto te falta para completar la colección.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://warframe-checker.danapps.dev/">
    <meta property="og:locale" content="es_ES">
    <meta property="og:image" content="https://warframe-checker.danapps.dev/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Captura del tracker con las tarjetas de Warframes Prime y sus componentes">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Para que Google sepa que es una aplicación web gratuita -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Warframe Prime Tracker",
        "url": "https://warframe-checker.danapps.dev/",
        "description": "Tracker para marcar los componentes de Warframes, armas, centinelas y archwings Prime que ya tienes.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "inLanguage": "es",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "author": { "@type": "Person", "name": "David Hernáez Castejón", "url": "https://danapps.dev/" }
    }
    </script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="header-top">
                <div class="logo">
                    <span class="logo-icon" aria-hidden="true">⚡</span>
                    <h1>Warframe Prime Tracker</h1>
                </div>

                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="search" class="search-input" id="searchInput" placeholder="Buscar Prime..." autocomplete="off" aria-label="Buscar Prime">
                </div>

                <div class="stats-bar">
                    <div class="stat-item">
                        <span class="stat-value" id="totalComplete">0</span>
                        <span class="stat-label">Completos</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="totalIncomplete">0</span>
                        <span class="stat-label">Incompletos</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-value" id="totalProgress">0%</span>
                        <span class="stat-label">Progreso Total</span>
                    </div>
                </div>
            </div>

            <!-- data-tab tiene que coincidir con las claves de ITEMS_BY_TAB en app.js -->
            <nav class="nav-tabs">
                <button type="button" class="nav-tab active" data-tab="warframes">
                    🎭 Warframes <span class="tab-count">0</span>
                </button>
                <button type="button" class="nav-tab" data-tab="weapons">
                    🗡️ Armas <span class="tab-count">0</span>
                </button>
                <button type="button" class="nav-tab" data-tab="sentinels">
                    🤖 Centinelas <span class="tab-count">0</span>
                </button>
                <button type="button" class="nav-tab" data-tab="archwings">
                    🚀 Archwings <span class="tab-count">0</span>
                </button>
            </nav>
        </div>
    </header>

    <section class="controls">
        <div class="filter-group" id="statusFilter">
            <button type="button" class="filter-btn active" data-filter="all">Todos</button>
            <button type="button" class="filter-btn" data-filter="complete">✅ Completos</button>
            <button type="button" class="filter-btn" data-filter="in-progress">⏳ En progreso</button>
            <button type="button" class="filter-btn" data-filter="missing">❌ Faltantes</button>
        </div>

        <!-- Solo se enseña en la pestaña de armas, las opciones las añade app.js -->
        <select class="category-select" id="categoryFilter" aria-label="Categoría" hidden>
            <option value="all">Todas las categorías</option>
        </select>

        <div class="data-controls">
            <button type="button" class="action-btn secondary" id="exportBtn">📥 Exportar Datos</button>
            <button type="button" class="action-btn secondary" id="importBtn">📤 Importar Datos</button>
            <input type="file" id="importFile" accept=".json" hidden>
        </div>
    </section>

    <main class="main-content">
        <div class="items-grid" id="itemsGrid"></div>
    </main>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
